{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
  <div><h4 class="mb-1">إدارة الشاحن والبلد</h4><p class="text-muted small mb-0">أضف الشاحن وحدد بلده مرة واحدة؛ يظهر البلد تلقائياً عند إضافة الشحنة.</p></div>
  <a href="{{ url_for('manage_countries') }}" class="btn btn-outline-secondary">إدارة قائمة البلدان</a>
</div>
<div class="row g-3">
 <div class="col-lg-4"><div class="card shadow-sm border-0"><div class="card-body">
  <h5>إضافة شاحن</h5>
  <form method="post">
   <label class="form-label" for="newName">اسم الشاحن (المعمل)</label><input id="newName" name="name" class="form-control" required maxlength="200">
   <label class="form-label mt-3" for="newCountry">البلد</label>
   <select id="newCountry" name="country_id" class="form-select" required><option value="">اختر البلد</option>{% for c in countries %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select>
   <button class="btn btn-primary w-100 mt-3">حفظ الشاحن والبلد</button>
  </form>
 </div></div></div>
 <div class="col-lg-8"><div class="card shadow-sm border-0"><div class="card-body">
  <h5>الشاحنون المسجلون</h5>
  {% for f in factories %}
  <form method="post" action="{{ url_for('update_factory', factory_id=f.id) }}" class="border rounded p-3 mb-3">
   <div class="row g-2 align-items-end">
    <div class="col-md-5"><label class="form-label">الشاحن</label><input name="name" class="form-control" value="{{ f.name }}" required></div>
    <div class="col-md-5"><label class="form-label">البلد</label><select name="country_id" class="form-select" required><option value="">حدد البلد</option>{% for c in countries %}<option value="{{ c.id }}" {% if f.country_id == c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
    <div class="col-md-2"><button class="btn btn-outline-primary w-100">تحديث</button></div>
   </div>
   <div class="d-flex justify-content-end mt-2"><button type="submit" form="deleteFactory{{ f.id }}" class="btn btn-outline-danger btn-sm" onclick="return confirm('حذف الشاحن؟')">حذف</button></div>
  </form>
  <form id="deleteFactory{{ f.id }}" method="post" action="{{ url_for('delete_factory', factory_id=f.id) }}"></form>
  {% else %}<p class="text-muted">لا يوجد شاحنون مسجلون.</p>{% endfor %}
 </div></div></div>
</div>
{% endblock %}
